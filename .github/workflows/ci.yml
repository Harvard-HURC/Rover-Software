# CI for every pull request and for main: the pixi tasks a laptop runs (README, Tests).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unix:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 24.04 (no GPU, the rendering tests skip)
            os: ubuntu-24.04
            rendering: "0"
          - name: macOS, Apple silicon (with the rendering tests)
            os: macos-15
            rendering: ""
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    env:
      GZ_IP: 127.0.0.1
      # ROS 2 discovery stays on the runner's loopback; each test process also takes a ROS domain of its own.
      ROS_AUTOMATIC_DISCOVERY_RANGE: LOCALHOST
      # tests/gpu.py: 0 skips the rendering tests (the Ubuntu runner has no GPU, whatever device nodes its virtual
      # machine shows); empty lets gpu.py decide (every Mac renders).
      ROVER_RENDERING: ${{ matrix.rendering }}
    defaults:
      run:
        working-directory: src
    steps:
      # The repository is the src/ folder of a colcon workspace: colcon builds in the folder above it.
      - uses: actions/checkout@v7.0.1
        with:
          path: src
      # The environment is cached per pixi.lock and saved from main only: a pull request that changes the lock
      # would otherwise save another few GB that only it can use (GitHub keeps 10 GB per repository).
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.81.0
          manifest-path: src/pixi.toml
          locked: true
          cache: true
          cache-write: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
      # The build needs no terrain data, so it is checked even when fetch-data fails.
      - run: pixi run build
      # The terrain rasters, cached by what makes them (the manifest, each raster's .json, fetch_data.py and
      # usgs_lidar.py: a change to the recipe rebuilds the lidar DEM here) and saved as soon as fetch-data succeeds,
      # whatever the tests do. A run whose fetch-data fails saves nothing, so the next run fetches them again.
      - name: Restore the terrain rasters
        id: rasters
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            src/rover_sim/data/dem/*.tif
            src/rover_sim/data/imagery/*.tif
          key: >-
            rasters-${{ runner.os }}-${{ hashFiles('src/rover_sim/data/rasters.json', 'src/rover_sim/data/dem/*.json',
            'src/rover_sim/data/imagery/*.json', 'src/rover_sim/tools/fetch_data.py',
            'src/rover_sim/tools/usgs_lidar.py') }}
      # fetch-data gets every raster the simulation reads from its official source and fails if one fails; the
      # Autonomy world's 0.5 m lidar DEM it rebuilds from USGS lidar (371 MB of downloads, 5 to 20 minutes, when
      # the cache misses). Off the Mac that made rasters.json the rebuild may round differently in the last bits:
      # fetch-data then keeps it within the tolerance of the manifest's stats and says that it is not bit-identical,
      # naming the runner's system and CPU.
      - run: pixi run fetch-data
      - name: Save the terrain rasters
        if: steps.rasters.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: |
            src/rover_sim/data/dem/*.tif
            src/rover_sim/data/imagery/*.tif
          key: ${{ steps.rasters.outputs.cache-primary-key }}
      # The colcon tests (rover.launch.py on the hardware stub among them) and the simulation's suite, which runs
      # RoverSimSystem inside Gazebo with the controllers and sim.launch.py headless (the smoke test): no GPU needed.
      - run: pixi run test
        env:
          # Rendering tests that save what their cameras saw write it here (outside the repository).
          ROVER_TEST_ARTIFACTS: ${{ github.workspace }}/test-artifacts
      # The tests regenerate tracked files (sim-model writes the rover's and the cameras' models, the wheel mesh and
      # the dust sprite): a generated file committed stale, or a test that changes a tracked file, fails here.
      - name: The tests left every tracked file as committed
        run: git diff --exit-code
      - name: Upload what the rendering tests saw
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: test-frames-${{ runner.os }}
          path: test-artifacts/
          if-no-files-found: ignore

  windows:
    name: Windows (rover_description, rover_control)
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          path: src
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.81.0
          manifest-path: src/pixi.toml
          locked: true
          cache: true
          cache-write: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
      - run: pixi run build
