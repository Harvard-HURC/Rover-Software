# ros_gz_bridge config for the rover: the sensor bridge launch/sim.launch.py runs (design spec 2026-10-09, 6.2;
# docs/topics.md). gz topics are set in rover_sim/config/sim.yaml (topics). /cmd_vel, /odom, /joint_states and /tf are
# not bridged: the drive controller, joint_state_broadcaster and robot_state_publisher provide them.
- ros_topic_name: /ground_truth/odom
  gz_topic_name: /model/rover/ground_truth
  ros_type_name: nav_msgs/msg/Odometry
  gz_type_name: gz.msgs.Odometry
  direction: GZ_TO_ROS
- ros_topic_name: /imu
  gz_topic_name: /model/rover/imu
  ros_type_name: sensor_msgs/msg/Imu
  gz_type_name: gz.msgs.IMU
  direction: GZ_TO_ROS
- ros_topic_name: /clock
  gz_topic_name: /clock
  ros_type_name: rosgraph_msgs/msg/Clock
  gz_type_name: gz.msgs.Clock
  direction: GZ_TO_ROS
# Physical drivetrain only (sim.yaml drivetrain mode physical): per-wheel setpoint, speed, current, torque, voltage,
# saturation, slip, load, ground and dig factor as JSON, 50 Hz.
- ros_topic_name: /drivetrain
  gz_topic_name: /model/rover/drivetrain
  ros_type_name: std_msgs/msg/String
  gz_type_name: gz.msgs.StringMsg
  direction: GZ_TO_ROS
# Sensors for the URC missions (rover_sim/urdf/rover_sim.urdf.xacro). The camera's topics are lazy: the bridge
# subscribes to Gazebo's only while a ROS node subscribes to its, so the camera renders and the bridge converts
# 1280x720 images and point clouds only for a reader (a camera renders only while its topic has subscribers).
- ros_topic_name: /gps/fix
  gz_topic_name: /model/rover/navsat
  ros_type_name: sensor_msgs/msg/NavSatFix
  gz_type_name: gz.msgs.NavSat
  direction: GZ_TO_ROS
- ros_topic_name: /camera/image
  gz_topic_name: /model/rover/camera/image
  ros_type_name: sensor_msgs/msg/Image
  gz_type_name: gz.msgs.Image
  direction: GZ_TO_ROS
  lazy: true
- ros_topic_name: /camera/depth
  gz_topic_name: /model/rover/camera/depth_image
  ros_type_name: sensor_msgs/msg/Image
  gz_type_name: gz.msgs.Image
  direction: GZ_TO_ROS
  lazy: true
- ros_topic_name: /camera/points
  gz_topic_name: /model/rover/camera/points
  ros_type_name: sensor_msgs/msg/PointCloud2
  gz_type_name: gz.msgs.PointCloudPacked
  direction: GZ_TO_ROS
  lazy: true
- ros_topic_name: /camera/camera_info
  gz_topic_name: /model/rover/camera/camera_info
  ros_type_name: sensor_msgs/msg/CameraInfo
  gz_type_name: gz.msgs.CameraInfo
  direction: GZ_TO_ROS
  lazy: true
# Status LED (rule 1.e.ii): publish "red", "blue", "green" (flashing) or "off".
- ros_topic_name: /led
  gz_topic_name: /model/rover/led
  ros_type_name: std_msgs/msg/String
  gz_type_name: gz.msgs.StringMsg
  direction: ROS_TO_GZ
# URC referee (sim/referee.py).
- ros_topic_name: /urc/score
  gz_topic_name: /urc/score
  ros_type_name: std_msgs/msg/String
  gz_type_name: gz.msgs.StringMsg
  direction: GZ_TO_ROS
- ros_topic_name: /urc/radio
  gz_topic_name: /urc/radio
  ros_type_name: std_msgs/msg/String
  gz_type_name: gz.msgs.StringMsg
  direction: GZ_TO_ROS
- ros_topic_name: /urc/display
  gz_topic_name: /urc/display
  ros_type_name: std_msgs/msg/String
  gz_type_name: gz.msgs.StringMsg
  direction: GZ_TO_ROS
- ros_topic_name: /astronaut/command
  gz_topic_name: /astronaut/command
  ros_type_name: std_msgs/msg/String
  gz_type_name: gz.msgs.StringMsg
  direction: GZ_TO_ROS
- ros_topic_name: /astronaut/speech
  gz_topic_name: /astronaut/speech
  ros_type_name: std_msgs/msg/String
  gz_type_name: gz.msgs.StringMsg
  direction: GZ_TO_ROS
- ros_topic_name: /lander/joint_states
  gz_topic_name: /model/lander/state
  ros_type_name: sensor_msgs/msg/JointState
  gz_type_name: gz.msgs.Model
  direction: GZ_TO_ROS
- ros_topic_name: /urc/launch_key
  gz_topic_name: /urc/launch_key
  ros_type_name: std_msgs/msg/String
  gz_type_name: gz.msgs.StringMsg
  direction: GZ_TO_ROS
# Camera pan-tilt head (rover_description's rover.urdf.xacro): target angles [rad], pan + left, tilt + down.
- ros_topic_name: /camera/pan
  gz_topic_name: /model/rover/joint/camera_pan_joint/0/cmd_pos
  ros_type_name: std_msgs/msg/Float64
  gz_type_name: gz.msgs.Double
  direction: ROS_TO_GZ
- ros_topic_name: /camera/tilt
  gz_topic_name: /model/rover/joint/camera_tilt_joint/0/cmd_pos
  ros_type_name: std_msgs/msg/Float64
  gz_type_name: gz.msgs.Double
  direction: ROS_TO_GZ
