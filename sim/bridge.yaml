# ros_gz_bridge config for the rover (pixi run sim-bridge).
# gz topics are set in sim/gen_model.py.
- ros_topic_name: /cmd_vel
  gz_topic_name: /model/rover/cmd_vel
  ros_type_name: geometry_msgs/msg/Twist
  gz_type_name: gz.msgs.Twist
  direction: ROS_TO_GZ
- ros_topic_name: /odom
  gz_topic_name: /model/rover/odometry
  ros_type_name: nav_msgs/msg/Odometry
  gz_type_name: gz.msgs.Odometry
  direction: GZ_TO_ROS
- ros_topic_name: /ground_truth/odom
  gz_topic_name: /model/rover/ground_truth
  ros_type_name: nav_msgs/msg/Odometry
  gz_type_name: gz.msgs.Odometry
  direction: GZ_TO_ROS
- ros_topic_name: /joint_states
  gz_topic_name: /model/rover/joint_states
  ros_type_name: sensor_msgs/msg/JointState
  gz_type_name: gz.msgs.Model
  direction: GZ_TO_ROS
- ros_topic_name: /imu
  gz_topic_name: /model/rover/imu
  ros_type_name: sensor_msgs/msg/Imu
  gz_type_name: gz.msgs.IMU
  direction: GZ_TO_ROS
- ros_topic_name: /tf
  gz_topic_name: /model/rover/tf
  ros_type_name: tf2_msgs/msg/TFMessage
  gz_type_name: gz.msgs.Pose_V
  direction: GZ_TO_ROS
- ros_topic_name: /clock
  gz_topic_name: /clock
  ros_type_name: rosgraph_msgs/msg/Clock
  gz_type_name: gz.msgs.Clock
  direction: GZ_TO_ROS
# Physical drivetrain only (DriveParams.mode "physical"): per-wheel setpoint, speed, current, torque, voltage,
# saturation, slip, load, ground and dig factor as JSON, 50 Hz.
- ros_topic_name: /drivetrain
  gz_topic_name: /model/rover/drivetrain
  ros_type_name: std_msgs/msg/String
  gz_type_name: gz.msgs.StringMsg
  direction: GZ_TO_ROS
# Sensors for the URC missions (sim/gen_model.py).
- ros_topic_name: /gps/fix
  gz_topic_name: /model/rover/navsat
  ros_type_name: sensor_msgs/msg/NavSatFix
  gz_type_name: gz.msgs.NavSat
  direction: GZ_TO_ROS
- ros_topic_name: /camera/image
  gz_topic_name: /model/rover/camera/image
  ros_type_name: sensor_msgs/msg/Image
  gz_type_name: gz.msgs.Image
  direction: GZ_TO_ROS
- ros_topic_name: /camera/depth
  gz_topic_name: /model/rover/camera/depth_image
  ros_type_name: sensor_msgs/msg/Image
  gz_type_name: gz.msgs.Image
  direction: GZ_TO_ROS
- ros_topic_name: /camera/points
  gz_topic_name: /model/rover/camera/points
  ros_type_name: sensor_msgs/msg/PointCloud2
  gz_type_name: gz.msgs.PointCloudPacked
  direction: GZ_TO_ROS
- ros_topic_name: /camera/camera_info
  gz_topic_name: /model/rover/camera/camera_info
  ros_type_name: sensor_msgs/msg/CameraInfo
  gz_type_name: gz.msgs.CameraInfo
  direction: GZ_TO_ROS
# Status LED (rule 1.e.ii): publish "red", "blue", "green" (flashing) or "off".
- ros_topic_name: /led
  gz_topic_name: /model/rover/led
  ros_type_name: std_msgs/msg/String
  gz_type_name: gz.msgs.StringMsg
  direction: ROS_TO_GZ
# URC referee (sim/referee.py).
- ros_topic_name: /urc/score
  gz_topic_name: /urc/score
  ros_type_name: std_msgs/msg/String
  gz_type_name: gz.msgs.StringMsg
  direction: GZ_TO_ROS
- ros_topic_name: /urc/radio
  gz_topic_name: /urc/radio
  ros_type_name: std_msgs/msg/String
  gz_type_name: gz.msgs.StringMsg
  direction: GZ_TO_ROS
- ros_topic_name: /urc/display
  gz_topic_name: /urc/display
  ros_type_name: std_msgs/msg/String
  gz_type_name: gz.msgs.StringMsg
  direction: GZ_TO_ROS
- ros_topic_name: /astronaut/command
  gz_topic_name: /astronaut/command
  ros_type_name: std_msgs/msg/String
  gz_type_name: gz.msgs.StringMsg
  direction: GZ_TO_ROS
- ros_topic_name: /astronaut/speech
  gz_topic_name: /astronaut/speech
  ros_type_name: std_msgs/msg/String
  gz_type_name: gz.msgs.StringMsg
  direction: GZ_TO_ROS
- ros_topic_name: /lander/joint_states
  gz_topic_name: /model/lander/state
  ros_type_name: sensor_msgs/msg/JointState
  gz_type_name: gz.msgs.Model
  direction: GZ_TO_ROS
- ros_topic_name: /urc/launch_key
  gz_topic_name: /urc/launch_key
  ros_type_name: std_msgs/msg/String
  gz_type_name: gz.msgs.StringMsg
  direction: GZ_TO_ROS
# Camera pan-tilt head (sim/gen_model.py): target angles [rad], pan + left, tilt + down.
- ros_topic_name: /camera/pan
  gz_topic_name: /model/rover/joint/camera_pan_joint/0/cmd_pos
  ros_type_name: std_msgs/msg/Float64
  gz_type_name: gz.msgs.Double
  direction: ROS_TO_GZ
- ros_topic_name: /camera/tilt
  gz_topic_name: /model/rover/joint/camera_tilt_joint/0/cmd_pos
  ros_type_name: std_msgs/msg/Float64
  gz_type_name: gz.msgs.Double
  direction: ROS_TO_GZ
